name: CI

on:
  pull_request:
  merge_group:

# Explicit minimum scope. Add `contents: write` (or narrower) only if a job
# needs to push to the repo (e.g., auto-generated coverage badges, lint fixes).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    name: evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # FB-0074 — assert the harness↔runner join. CI enumerates harnesses by hand (it
      # must: the list is segmented across the evals + security jobs, which a glob would
      # flatten). But nothing checked that the hand-written list is COMPLETE — and a run
      # with 19 of 20 harnesses is byte-identical to one with all 20, so an unwired
      # harness contributes zero regression protection while appearing to. That is the
      # exact "contract split across two files, nothing checks the join" class this
      # release fixes; it was previously guarded only by author memory.
      - name: every eval harness is wired into this workflow (and vice versa)
        run: |
          ON_DISK=$(ls plugins/flow/evals/run_*.py | xargs -n1 basename | sort -u)
          # Scope to EXECUTABLE step lines. A bare textual grep would count a harness
          # merely NAMED in a comment as wired — satisfying the join while nothing runs
          # it, which is byte-identical to the real thing. That is the same failure this
          # step exists to catch, so the step must not commit it.
          IN_CI=$(grep -oE '^[[:space:]]*-[[:space:]]+run:[[:space:]]+python3[[:space:]]+plugins/flow/evals/run_[a-z_]+\.py' \
                    .github/workflows/ci.yml | grep -oE 'run_[a-z_]+\.py' | sort -u)
          if [ "$ON_DISK" != "$IN_CI" ]; then
            echo "::error::eval harness/CI-runner mismatch — an unwired harness gives ZERO regression protection."
            diff <(echo "$ON_DISK") <(echo "$IN_CI") \
              --label "harnesses on disk" --label "harnesses run by ci.yml" -u || true
            exit 1
          fi
          echo "harness/runner join OK — $(echo "$ON_DISK" | wc -l | tr -d ' ') harnesses, all wired."
      - run: python3 plugins/flow/evals/run_evals.py
      - run: python3 plugins/flow/evals/run_walk_extract_evals.py
      - run: python3 plugins/flow/evals/run_plan_file_evals.py
      - run: python3 plugins/flow/evals/run_pin_lint_evals.py
      - run: python3 plugins/flow/evals/run_status_docs_evals.py
      - run: python3 plugins/flow/evals/run_status_surface_evals.py
      - run: python3 plugins/flow/evals/run_visual_history_evals.py
      - run: python3 plugins/flow/evals/run_render_evals.py
      - run: python3 plugins/flow/evals/run_report_render_evals.py
      - run: python3 plugins/flow/evals/run_frame_integrity_evals.py
      - run: python3 plugins/flow/evals/run_rigor_marker_evals.py
      - run: python3 plugins/flow/evals/run_contribution_evals.py
      - run: python3 plugins/flow/evals/run_land_evals.py
      - run: python3 plugins/flow/evals/run_merge_status_evals.py
      - run: python3 plugins/flow/evals/run_visual_significance_evals.py
      - run: python3 plugins/flow/evals/run_skip_audit_evals.py
      - run: python3 plugins/flow/evals/run_pr_coherence_evals.py
      - run: python3 plugins/flow/evals/run_skill_composition_evals.py
      - run: python3 plugins/flow/evals/run_root_anchor_evals.py
      - run: python3 plugins/flow/evals/run_manifest_triage_evals.py
      - run: python3 plugins/flow/evals/run_plugin_desc_evals.py
      - run: python3 plugins/flow/evals/run_jq_guard_evals.py
      - run: python3 plugins/flow/evals/run_role_slot_evals.py

  dev-docs:
    name: dev-docs index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: every point-in-time doc is indexed + status-lined (FB-0085)
        run: python3 dev-docs/check-index.py

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 plugins/flow/evals/run_security_evals.py
      - run: python3 plugins/flow/evals/run_scratch_isolation_evals.py
